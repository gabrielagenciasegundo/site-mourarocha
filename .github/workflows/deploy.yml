name: Deploy (React + PHP) via FTP

on:
  push:
    branches: ["main"]

concurrency:
  group: deploy-react-ftp
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build React App
        run: npm run build
        # env:
          # VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      # 💡 PASSO NOVO: Copia o arquivo PHP para a pasta de build
      # - name: Copy contato.php to dist
      #   run: |
      #     if [ -f "contato.php" ]; then
      #       cp contato.php dist/
      #       echo "✅ contato.php copiado para dist/"
      #     else
      #       echo "⚠️ contato.php não encontrado na raiz!"
      #     fi

      - name: 🚀 Sync Files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ vars.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/ 
          server-dir: ./
          delete-clean: true